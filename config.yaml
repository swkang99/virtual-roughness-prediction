# =============================================================================
# Training Configuration
# =============================================================================

# Default Training settings
batch_size: 56
epochs: 300
learning_rate: 1e-3
weight_decay: 1e-4
train_tag: 'default'        # output-folder tag used by src/trainer.py's own pipeline only
                             # (test/cv_experiment.py ignores this and takes --tag / auto-generates one instead)

# =============================================================================
# Data Configuration
# =============================================================================

# Legacy train/val/test split paths - used only by src/trainer.py's own full-training pipeline,
# NOT by the Tier-based CV pipeline (test/cv_experiment.py), which uses data_tier_root below instead.
data_train_path: 'data/train'
data_val_path: 'data/val'
data_test_path: 'data/test'
data_patch_path: 'patches'
map_dir: 'ps_maps'          # Photoshop height/normal map crops (python -m src.data.crop_photoshop_maps)

# Tier-based train pool (Tier B + Tier A'; see test/cv_experiment.py, claude/whc2027_apt_relabeling_strategy.md).
# Tier A (native APT, test-only) lives under the same root but is never loaded by cv_experiment.py.
data_tier_root: 'data/trustworthy'

feature_cache_root: 'data/features'   # cached GLCM/LBP features for feature-based models (lr/svr/ann/cnn_1d_*/gated_mlp*)
force_recompute_features: false       # true: ignore the cache above and recompute + overwrite it
feature_mode: 'original'    # 'original' = Hassan et al. re-implementation (output/review/WASEEM_CODE_REVIEW.md)
                             # 'legacy'   = earlier feature pipeline (results so far)

# =============================================================================
# Model Configuration
# =============================================================================

# Model options:
#   1. lr             : Linear Regressor
#   2. svr            : Support Vector Regressor
#   3. ann            : Artificial Neural Network (Simple DNN)
#   4. cnn_1d_scirep  : 1D-CNN (Taye et al.)
#   5. cnn_1d_wassem  : 1D-CNN (Hassan et al.)
#   6. cnn_1d_simple  : Simple 1D-CNN for comparing with proposed model
#   7. transformer    : Proposed Transformer Regressor
#   8. gated_mlp      : Proposed Gated Fusion MLP
#   9. gated_mlp_v2   : Proposed Gated Fusion MLP (v2)
model: transformer
